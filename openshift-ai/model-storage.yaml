apiVersion: v1
kind: List
items:
  # One RWO PVC per model: three pods on different nodes can each mount their
  # own volume without Multi-Attach errors. ~2 GiB data + overhead each.
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: pathology-models-conch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 4Gi
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: pathology-models-titan
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 4Gi
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: pathology-models-virchow2
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 6Gi
